      summary: Get or update the current user's profile
      tags:
      - Profiles
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentProfile'
          description: ''
    put:
      operationId: auth_profile_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CurrentProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CurrentProfile'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentProfile'
          description: ''
    patch:
      operationId: auth_profile_partial_update
      summary: Update the current user's profile
      tags:
      - Profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurrentProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurrentProfile'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentProfile'
          description: ''
  /api/auth/profiles/{user_id}/:
    get:
      operationId: auth_profiles_retrieve
      description: Returns role-appropriate public profile fields. Email and phone
        are never included.
      summary: View a user's public profile
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Profiles
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Create a new user account with a client or freelancer role.
      summary: Register a new user
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
