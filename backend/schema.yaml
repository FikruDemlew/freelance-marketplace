components:
  schemas:
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        job:
          type: integer
        job_title:
          type: string
          readOnly: true
        freelancer:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        freelancer_id:
          type: integer
          readOnly: true
        proposal:
          type: string
        bid_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bid_amount
      - created_at
      - freelancer
      - freelancer_id
      - id
      - job
      - job_title
      - proposal
    ApplicationStatusEnum:
      enum:
      - Pending
      - Accepted
      - Rejected
      type: string
      description: |-
        * `Pending` - Pending
        * `Accepted` - Accepted
        * `Rejected` - Rejected
    CategoryEnum:
      enum:
      - Web Development
      - Mobile Development
      - UI/UX Design
      - Graphics Design
      - Writing
      - Video Editing
      - Music Production
      - Admin & Virtual Assistance
      - Sales & Lead Generation
      - Data & Analytics
      - Data Science
      - Engineering & Architecture
      - Business Consulting & Strategy
      - Other
      type: string
      description: |-
        * `Web Development` - Web Development
        * `Mobile Development` - Mobile Development
        * `UI/UX Design` - UI/UX Design
        * `Graphics Design` - Graphics Design
        * `Writing` - Writing
        * `Video Editing` - Video Editing
        * `Music Production` - Music Production
        * `Admin & Virtual Assistance` - Admin & Virtual Assistance
        * `Sales & Lead Generation` - Sales & Lead Generation
        * `Data & Analytics` - Data & Analytics
        * `Data Science` - Data Science
        * `Engineering & Architecture` - Engineering & Architecture
        * `Business Consulting & Strategy` - Business Consulting & Strategy
        * `Other` - Other
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        application:
          type: integer
        client:
          type: integer
          readOnly: true
        client_username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        freelancer:
          type: integer
          readOnly: true
        freelancer_username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - application
      - client
      - client_username
      - created_at
      - freelancer
      - freelancer_username
      - id
      - updated_at
    CurrentProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        display_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        profile_image:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
        location:
          type: string
          maxLength: 120
        skills:
          type: array
          items:
            type: string
            maxLength: 50
        experience:
          type: string
        hourly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        portfolio_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        github_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        linkedin_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        company_name:
          type: string
          maxLength: 200
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        rating:
          type: number
          format: double
          nullable: true
          readOnly: true
        reviews_count:
          type: integer
          readOnly: true
        jobs_posted:
          type: integer
          readOnly: true
        jobs_completed:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 20
      required:
      - created_at
      - display_name
      - id
      - jobs_completed
      - jobs_posted
      - rating
      - reviews_count
      - role
      - updated_at
      - user_id
      - username
    Job:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        client_id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryEnum'
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        deadline:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        applications_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - applications_count
      - budget
      - category
      - client
      - client_id
      - created_at
      - deadline
      - description
      - id
      - title
    JobStatusEnum:
      enum:
      - Open
      - In Progress
      - Completed
      - Closed
      type: string
      description: |-
        * `Open` - Open
        * `In Progress` - In Progress
        * `Completed` - Completed
        * `Closed` - Closed
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        conversation:
          type: integer
          readOnly: true
        sender:
          type: integer
          readOnly: true
        sender_username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        content:
          type: string
        is_read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - conversation
      - created_at
      - id
      - is_read
      - sender
      - sender_username
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        application_id:
          type: integer
          readOnly: true
          nullable: true
        notification_type:
          allOf:
          - $ref: '#/components/schemas/NotificationTypeEnum'
          readOnly: true
        message:
          type: string
          readOnly: true
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - application_id
      - created_at
      - id
      - message
      - notification_type
    NotificationTypeEnum:
      enum:
      - application
      - accepted
      - rejected
      - message
      type: string
      description: |-
        * `application` - Application
        * `accepted` - Accepted
        * `rejected` - Rejected
        * `message` - Message
    PatchedApplication:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        job:
